<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace, monospace">
  <title>SMT divergence: NQ prints a new high while ES fails to confirm it, flagging bearish SMT</title>
  <rect x="1" y="1" width="798" height="448" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <text x="400" y="30" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="bold">SMT Divergence: NQ Confirms, ES Fails</text>

  <!-- divider -->
  <line x1="400" y1="55" x2="400" y2="400" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ===== LEFT: NQ ===== -->
  <text x="60" y="65" fill="#22d3ee" font-size="14" font-weight="bold">NQ</text>
  <g stroke="#1e293b" stroke-opacity="0.4">
    <line x1="46" y1="130" x2="370" y2="130"/>
    <line x1="46" y1="210" x2="370" y2="210"/>
    <line x1="46" y1="290" x2="370" y2="290"/>
  </g>
  <line x1="60" y1="235" x2="370" y2="235" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="62" y="230" fill="#e5e7eb" font-size="11">Prior high</text>

  <g stroke-width="1.5">
    <line x1="80" y1="330" x2="80" y2="288" stroke="#22c55e"/>
    <rect x="68" y="290" width="24" height="40" fill="#22c55e"/>
    <line x1="140" y1="292" x2="140" y2="238" stroke="#22c55e"/>
    <rect x="128" y="240" width="24" height="50" fill="#22c55e"/>
    <line x1="200" y1="262" x2="200" y2="238" stroke="#ef4444"/>
    <rect x="188" y="240" width="24" height="20" fill="#ef4444"/>
    <line x1="260" y1="262" x2="260" y2="208" stroke="#22c55e"/>
    <rect x="248" y="210" width="24" height="50" fill="#22c55e"/>
    <line x1="320" y1="212" x2="320" y2="165" stroke="#22c55e"/>
    <rect x="308" y="170" width="24" height="42" fill="#22c55e"/>
  </g>
  <circle cx="320" cy="165" r="5" fill="#22d3ee"/>
  <text x="200" y="335" fill="#22d3ee" font-size="12">New high — BSL taken</text>

  <!-- ===== RIGHT: ES ===== -->
  <text x="440" y="65" fill="#f472b6" font-size="14" font-weight="bold">ES</text>
  <g stroke="#1e293b" stroke-opacity="0.4">
    <line x1="426" y1="130" x2="750" y2="130"/>
    <line x1="426" y1="210" x2="750" y2="210"/>
    <line x1="426" y1="290" x2="750" y2="290"/>
  </g>
  <line x1="440" y1="235" x2="750" y2="235" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="442" y="230" fill="#e5e7eb" font-size="11">Prior high</text>

  <g stroke-width="1.5">
    <line x1="460" y1="330" x2="460" y2="288" stroke="#22c55e"/>
    <rect x="448" y="290" width="24" height="40" fill="#22c55e"/>
    <line x1="520" y1="292" x2="520" y2="238" stroke="#22c55e"/>
    <rect x="508" y="240" width="24" height="50" fill="#22c55e"/>
    <line x1="580" y1="262" x2="580" y2="238" stroke="#ef4444"/>
    <rect x="568" y="240" width="24" height="20" fill="#ef4444"/>
    <line x1="640" y1="262" x2="640" y2="212" stroke="#22c55e"/>
    <rect x="628" y="215" width="24" height="45" fill="#22c55e"/>
    <!-- fails to confirm: stalls below the prior-high line -->
    <line x1="700" y1="272" x2="700" y2="238" stroke="#ef4444"/>
    <rect x="688" y="242" width="24" height="28" fill="#ef4444"/>
  </g>
  <circle cx="700" cy="238" r="5" fill="none" stroke="#f472b6" stroke-width="2"/>
  <text x="600" y="335" fill="#f472b6" font-size="12">Fails to confirm</text>

  <text x="400" y="420" text-anchor="middle" fill="#e5e7eb" font-size="13">Bearish SMT: NQ leads, ES lags -&gt; watch NQ for an MSS down</text>
</svg>
