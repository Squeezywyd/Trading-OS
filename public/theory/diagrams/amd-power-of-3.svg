<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, monospace">
  <title>AMD / Power of 3: Accumulation (Asia range), Manipulation (London Judas sweep), Distribution (NY displacement)</title>
  <rect x="1" y="1" width="898" height="298" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">AMD / Power of 3 — one fractal, every timeframe</text>

  <g stroke="#1e293b" stroke-opacity="0.4">
    <line x1="24" y1="80" x2="876" y2="80"/>
    <line x1="24" y1="140" x2="876" y2="140"/>
    <line x1="24" y1="200" x2="876" y2="200"/>
  </g>

  <!-- Accumulation zone -->
  <rect x="40" y="120" width="200" height="60" fill="#e5e7eb" opacity="0.08" stroke="#e5e7eb" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <text x="60" y="115" fill="#e5e7eb" font-size="12" font-weight="bold">A — Accumulation</text>
  <text x="60" y="255" fill="#94a3b8" font-size="11">Asia 20:00-00:00 ET — range</text>
  <g>
    <line x1="70" y1="140" x2="70" y2="160" stroke="#22c55e" stroke-width="2"/><rect x="65" y="145" width="10" height="10" fill="#22c55e"/>
    <line x1="100" y1="145" x2="100" y2="165" stroke="#ef4444" stroke-width="2"/><rect x="95" y="148" width="10" height="10" fill="#ef4444"/>
    <line x1="130" y1="140" x2="130" y2="160" stroke="#22c55e" stroke-width="2"/><rect x="125" y="145" width="10" height="10" fill="#22c55e"/>
    <line x1="160" y1="145" x2="160" y2="165" stroke="#ef4444" stroke-width="2"/><rect x="155" y="148" width="10" height="10" fill="#ef4444"/>
    <line x1="190" y1="140" x2="190" y2="160" stroke="#22c55e" stroke-width="2"/><rect x="185" y="145" width="10" height="10" fill="#22c55e"/>
  </g>

  <!-- Manipulation spike -->
  <rect x="260" y="80" width="140" height="200" fill="#f59e0b" opacity="0.10"/>
  <text x="270" y="115" fill="#f59e0b" font-size="12" font-weight="bold">M — Manipulation</text>
  <text x="255" y="255" fill="#94a3b8" font-size="11">London/NY — Judas raid</text>
  <line x1="330" y1="85" x2="330" y2="175" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="323" y="140" width="14" height="30" fill="#f59e0b"/>
  <text x="336" y="95" fill="#f59e0b" font-size="11">sweeps SSL</text>
  <line x1="40" y1="180" x2="400" y2="180" stroke="#f472b6" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="405" y="184" fill="#f472b6" font-size="11">range low (liquidity)</text>

  <!-- MSS marker -->
  <path d="M 340 170 L 380 130" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="345" y="120" fill="#22d3ee" font-size="11" font-weight="bold">MSS + displacement</text>

  <!-- Distribution -->
  <rect x="420" y="60" width="420" height="100" fill="#22c55e" opacity="0.08"/>
  <text x="440" y="115" fill="#22c55e" font-size="12" font-weight="bold">D — Distribution</text>
  <text x="420" y="255" fill="#94a3b8" font-size="11">NY AM — real displacement, draw on liquidity</text>
  <g>
    <line x1="440" y1="140" x2="440" y2="110" stroke="#22c55e" stroke-width="2"/><rect x="434" y="115" width="12" height="25" fill="#22c55e"/>
    <line x1="480" y1="120" x2="480" y2="90" stroke="#22c55e" stroke-width="2"/><rect x="474" y="95" width="12" height="25" fill="#22c55e"/>
    <line x1="520" y1="100" x2="520" y2="70" stroke="#22c55e" stroke-width="2"/><rect x="514" y="75" width="12" height="25" fill="#22c55e"/>
    <line x1="560" y1="85" x2="560" y2="65" stroke="#22c55e" stroke-width="2"/><rect x="554" y="68" width="12" height="17" fill="#22c55e"/>
    <line x1="600" y1="75" x2="600" y2="90" stroke="#ef4444" stroke-width="2"/><rect x="594" y="78" width="12" height="10" fill="#ef4444"/>
    <line x1="640" y1="70" x2="640" y2="95" stroke="#22c55e" stroke-width="2"/><rect x="634" y="75" width="12" height="18" fill="#22c55e"/>
  </g>
  <line x1="420" y1="65" x2="840" y2="65" stroke="#f472b6" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="620" y="60" fill="#f472b6" font-size="11">target: range high / PDH</text>

  <text x="24" y="285" fill="#94a3b8" font-size="11" font-style="italic">Fractal: the same A-M-D shape repeats on Weekly, Daily, session and 15m charts.</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>
</svg>
