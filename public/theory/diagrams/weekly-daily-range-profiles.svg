<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace, monospace">
  <title>A Classic Tuesday low weekly profile: Monday range, Tuesday liquidity sweep and reversal, Wednesday-Thursday expansion, Friday consolidation</title>
  <rect x="10" y="10" width="780" height="430" rx="12" fill="#0b1220" stroke="#1e293b" />
  <text x="400" y="36" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="bold">Weekly Range Profile — Classic Tuesday Low</text>

  <!-- day separators -->
  <g stroke="#1e293b" stroke-dasharray="4,4">
    <line x1="200" y1="60" x2="200" y2="400" />
    <line x1="340" y1="60" x2="340" y2="400" />
    <line x1="480" y1="60" x2="480" y2="400" />
    <line x1="620" y1="60" x2="620" y2="400" />
  </g>

  <!-- Monday low liquidity level -->
  <line x1="60" y1="305" x2="340" y2="305" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="65" y="298" fill="#f472b6" font-size="11">Monday low (resting liquidity)</text>

  <!-- FVG zone (Wednesday pullback) -->
  <rect x="345" y="232" width="45" height="35" fill="#a78bfa" fill-opacity="0.25" stroke="#a78bfa" stroke-opacity="0.6" />
  <text x="367" y="222" text-anchor="middle" fill="#a78bfa" font-size="10">FVG</text>

  <!-- price path -->
  <polyline points="70,300 140,290 195,306 230,332 260,250 300,220 340,232 367,252 390,190 420,150 480,140 540,108 600,120 680,130 750,124"
    fill="none" stroke="#e5e7eb" stroke-width="2.5" />

  <!-- sweep marker -->
  <circle cx="230" cy="332" r="5" fill="#f472b6" />
  <text x="230" y="352" text-anchor="middle" fill="#f472b6" font-size="10">sweep</text>

  <!-- MSS marker -->
  <line x1="300" y1="205" x2="300" y2="235" stroke="#22d3ee" stroke-width="2" />
  <text x="300" y="196" text-anchor="middle" fill="#22d3ee" font-size="10">MSS + displacement</text>

  <!-- day labels -->
  <g fill="#94a3b8" font-size="12" text-anchor="middle">
    <text x="130" y="420">Monday</text>
    <text x="270" y="420">Tuesday</text>
    <text x="410" y="420">Wednesday</text>
    <text x="550" y="420">Thursday</text>
    <text x="690" y="420">Friday</text>
  </g>

  <text x="400" y="80" text-anchor="middle" fill="#64748b" font-size="10">Mon: narrow range. Tue: sweeps Monday low, reverses with displacement. Wed–Thu: expansion. Fri: consolidation.</text>
</svg>
