<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, monospace">
  <title>Breaker block versus mitigation block</title>
  <rect x="1" y="1" width="798" height="448" rx="10" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <line x1="400" y1="20" x2="400" y2="430" stroke="#1e293b" stroke-width="2"/>

  <!-- LEFT: Breaker -->
  <text x="24" y="30" fill="#e5e7eb" font-size="15" font-weight="bold">Breaker: sweeps the extreme, then flips</text>
  <line x1="40" y1="260" x2="380" y2="260" stroke="#f472b6" stroke-dasharray="5 4"/>
  <text x="290" y="252" fill="#f472b6" font-size="10">prior low</text>
  <!-- bullish OB that will fail -->
  <rect x="90" y="150" width="26" height="40" fill="#22c55e" stroke="#22c55e"/>
  <line x1="103" y1="140" x2="103" y2="195" stroke="#22c55e" stroke-width="2"/>
  <rect x="80" y="130" width="120" height="60" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="82" y="122" fill="#f59e0b" font-size="10">old bullish OB</text>
  <!-- small bounce then sweep below prior low -->
  <line x1="150" y1="170" x2="150" y2="220" stroke="#22c55e" stroke-width="2"/>
  <rect x="138" y="175" width="24" height="30" fill="#22c55e" stroke="#22c55e"/>
  <line x1="200" y1="220" x2="200" y2="295" stroke="#ef4444" stroke-width="2"/>
  <rect x="188" y="235" width="24" height="45" fill="#ef4444" stroke="#ef4444"/>
  <text x="175" y="310" fill="#f472b6" font-size="10">sweeps low</text>
  <!-- close through the OB -->
  <line x1="250" y1="150" x2="250" y2="330" stroke="#ef4444" stroke-width="2"/>
  <rect x="238" y="185" width="24" height="140" fill="#ef4444" stroke="#ef4444"/>
  <text x="220" y="345" fill="#ef4444" font-size="10">closes through OB</text>
  <!-- flipped zone -->
  <rect x="80" y="130" width="220" height="60" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.5"/>
  <text x="82" y="112" fill="#ef4444" font-size="11">now a bearish BREAKER (resistance)</text>
  <!-- retest -->
  <line x1="330" y1="160" x2="330" y2="210" stroke="#ef4444" stroke-width="2"/>
  <rect x="318" y="165" width="24" height="25" fill="#ef4444" stroke="#ef4444"/>
  <text x="300" y="220" fill="#94a3b8" font-size="10">retest → short</text>

  <!-- RIGHT: Mitigation -->
  <text x="424" y="30" fill="#e5e7eb" font-size="15" font-weight="bold">Mitigation: no sweep, fails early</text>
  <line x1="440" y1="290" x2="770" y2="290" stroke="#f472b6" stroke-dasharray="5 4"/>
  <text x="700" y="282" fill="#f472b6" font-size="10">prior low (untouched)</text>
  <rect x="490" y="150" width="26" height="40" fill="#22c55e" stroke="#22c55e"/>
  <line x1="503" y1="140" x2="503" y2="195" stroke="#22c55e" stroke-width="2"/>
  <rect x="480" y="130" width="110" height="60" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="482" y="122" fill="#f59e0b" font-size="10">old bullish OB</text>
  <!-- higher low, doesn't reach prior low -->
  <line x1="550" y1="190" x2="550" y2="240" stroke="#22c55e" stroke-width="2"/>
  <rect x="538" y="195" width="24" height="30" fill="#22c55e" stroke="#22c55e"/>
  <text x="530" y="255" fill="#94a3b8" font-size="10">higher low (no sweep)</text>
  <line x1="600" y1="150" x2="600" y2="300" stroke="#ef4444" stroke-width="2"/>
  <rect x="588" y="180" width="24" height="120" fill="#ef4444" stroke="#ef4444"/>
  <text x="565" y="315" fill="#ef4444" font-size="10">closes through OB</text>
  <rect x="480" y="130" width="220" height="60" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="482" y="112" fill="#22d3ee" font-size="11">MITIGATION block (weaker, continuation)</text>
  <line x1="660" y1="160" x2="660" y2="210" stroke="#ef4444" stroke-width="2"/>
  <rect x="648" y="165" width="24" height="25" fill="#ef4444" stroke="#ef4444"/>
  <text x="628" y="220" fill="#94a3b8" font-size="10">retest → short</text>

  <g font-size="11" fill="#e5e7eb">
    <rect x="30" y="400" width="12" height="12" fill="#ef4444" fill-opacity="0.4"/>
    <text x="48" y="410">Breaker zone (sweep + flip = stronger)</text>
    <rect x="330" y="400" width="12" height="12" fill="#22d3ee" fill-opacity="0.4"/>
    <text x="348" y="410">Mitigation zone (no sweep = weaker)</text>
  </g>
</svg>
