<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, monospace">
  <title>Bullish order block: sweep, last down-close candle, displacement</title>
  <rect x="1" y="1" width="798" height="448" rx="10" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <g stroke="#1e293b" stroke-opacity="0.4">
    <line x1="30" y1="100" x2="770" y2="100"/>
    <line x1="30" y1="170" x2="770" y2="170"/>
    <line x1="30" y1="240" x2="770" y2="240"/>
    <line x1="30" y1="310" x2="770" y2="310"/>
    <line x1="30" y1="380" x2="770" y2="380"/>
  </g>
  <text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Bullish Order Block</text>
  <text x="24" y="48" fill="#94a3b8" font-size="12">Last down-close candle before displacement that breaks structure</text>

  <!-- prior swing low / liquidity pool -->
  <line x1="60" y1="330" x2="760" y2="330" stroke="#f472b6" stroke-dasharray="5 4"/>
  <text x="655" y="322" fill="#f472b6" font-size="11">prior swing low (SSL pool)</text>

  <!-- leg down into the sweep -->
  <line x1="90" y1="180" x2="90" y2="260" stroke="#ef4444" stroke-width="2"/>
  <rect x="78" y="190" width="24" height="55" fill="#ef4444" stroke="#ef4444"/>
  <line x1="150" y1="210" x2="150" y2="290" stroke="#ef4444" stroke-width="2"/>
  <rect x="138" y="220" width="24" height="55" fill="#ef4444" stroke="#ef4444"/>

  <!-- sweep candle: wick below the pool, closes back above -->
  <line x1="210" y1="230" x2="210" y2="345" stroke="#ef4444" stroke-width="2"/>
  <rect x="198" y="255" width="24" height="45" fill="#ef4444" stroke="#ef4444"/>
  <text x="180" y="360" fill="#f472b6" font-size="11">sweep</text>

  <!-- the OB candle: last down-close before the up move -->
  <line x1="270" y1="240" x2="270" y2="300" stroke="#ef4444" stroke-width="2"/>
  <rect x="258" y="248" width="24" height="42" fill="#ef4444" stroke="#ef4444"/>
  <text x="240" y="315" fill="#f59e0b" font-size="11">OB candle</text>

  <!-- OB zone box spanning from candle body -->
  <rect x="255" y="248" width="440" height="42" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.6"/>
  <line x1="255" y1="269" x2="695" y2="269" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="700" y="255" fill="#f59e0b" font-size="11">OB zone</text>
  <text x="700" y="273" fill="#f59e0b" font-size="11">50%</text>

  <!-- displacement up leaving FVG -->
  <line x1="330" y1="130" x2="330" y2="255" stroke="#22c55e" stroke-width="2"/>
  <rect x="318" y="140" width="24" height="105" fill="#22c55e" stroke="#22c55e"/>
  <line x1="390" y1="100" x2="390" y2="160" stroke="#22c55e" stroke-width="2"/>
  <rect x="378" y="105" width="24" height="45" fill="#22c55e" stroke="#22c55e"/>
  <rect x="315" y="150" width="90" height="20" fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="318" y="185" fill="#a78bfa" font-size="10">FVG left by displacement</text>

  <!-- structure break marker -->
  <line x1="60" y1="140" x2="760" y2="140" stroke="#22d3ee" stroke-dasharray="5 4"/>
  <text x="655" y="132" fill="#22d3ee" font-size="11">prior high (MSS break)</text>

  <!-- return leg into OB -->
  <line x1="480" y1="180" x2="480" y2="270" stroke="#ef4444" stroke-width="2"/>
  <rect x="468" y="200" width="24" height="60" fill="#ef4444" stroke="#ef4444"/>
  <text x="450" y="290" fill="#94a3b8" font-size="11">return into OB</text>

  <!-- entry marker at 50% -->
  <circle cx="480" cy="269" r="5" fill="#facc15"/>
  <text x="495" y="272" fill="#facc15" font-size="11">entry</text>

  <!-- stop below OB extreme -->
  <line x1="60" y1="298" x2="760" y2="298" stroke="#ef4444" stroke-opacity="0.6" stroke-dasharray="2 3"/>
  <text x="700" y="312" fill="#ef4444" font-size="11">stop</text>
</svg>
