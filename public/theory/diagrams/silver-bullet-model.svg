<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, monospace">
  <title>Silver Bullet windows on the NY timeline, with the 10-11am window detailed: liquidity sweep, FVG formation, retrace entry</title>
  <rect x="1" y="1" width="898" height="298" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="30" fill="#e5e7eb" font-size="16" font-weight="bold">Silver Bullet — three 1-hour windows (NY time)</text>

  <!-- timeline -->
  <line x1="40" y1="60" x2="860" y2="60" stroke="#1e293b" stroke-width="2"/>
  <g font-size="11" fill="#94a3b8">
    <text x="40" y="52">00:00</text>
    <text x="200" y="52">03:00-04:00</text>
    <text x="420" y="52">10:00-11:00</text>
    <text x="640" y="52">14:00-15:00</text>
    <text x="820" y="52">24:00</text>
  </g>
  <rect x="190" y="55" width="60" height="10" fill="#a78bfa" opacity="0.5"/>
  <rect x="410" y="55" width="70" height="10" fill="#f59e0b" opacity="0.7"/>
  <rect x="630" y="55" width="60" height="10" fill="#a78bfa" opacity="0.5"/>
  <text x="415" y="45" fill="#f59e0b" font-size="11" font-weight="bold">highest-probability window</text>

  <!-- detail panel for 10-11 window -->
  <g stroke="#1e293b" stroke-opacity="0.4">
    <line x1="60" y1="120" x2="840" y2="120"/>
    <line x1="60" y1="170" x2="840" y2="170"/>
    <line x1="60" y1="220" x2="840" y2="220"/>
  </g>
  <rect x="60" y="90" width="780" height="170" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <text x="70" y="105" fill="#f59e0b" font-size="12">10:00-11:00 ET detail</text>

  <!-- liquidity level -->
  <line x1="80" y1="150" x2="840" y2="150" stroke="#f472b6" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="700" y="145" fill="#f472b6" font-size="11">prior liquidity level (swing high)</text>

  <!-- candles: approach, sweep, reversal -->
  <g>
    <line x1="120" y1="180" x2="120" y2="210" stroke="#22c55e" stroke-width="2"/><rect x="114" y="185" width="12" height="20" fill="#22c55e"/>
    <line x1="160" y1="170" x2="160" y2="200" stroke="#22c55e" stroke-width="2"/><rect x="154" y="175" width="12" height="20" fill="#22c55e"/>
    <line x1="200" y1="130" x2="200" y2="185" stroke="#22c55e" stroke-width="2.5"/><rect x="193" y="145" width="14" height="30" fill="#22c55e"/>
    <text x="180" y="122" fill="#f59e0b" font-size="11">sweeps high</text>
  </g>

  <!-- FVG from reversal -->
  <rect x="240" y="180" width="70" height="40" fill="#a78bfa" opacity="0.22"/>
  <text x="242" y="235" fill="#a78bfa" font-size="11">FVG (entry zone)</text>

  <g>
    <line x1="260" y1="200" x2="260" y2="235" stroke="#ef4444" stroke-width="2"/><rect x="254" y="205" width="12" height="25" fill="#ef4444"/>
  </g>

  <!-- retrace + entry -->
  <path d="M 330 210 L 380 195" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <text x="335" y="190" fill="#22d3ee" font-size="12" font-weight="bold">entry on FVG tap</text>

  <g>
    <line x1="420" y1="205" x2="420" y2="230" stroke="#ef4444" stroke-width="2"/><rect x="414" y="210" width="12" height="18" fill="#ef4444"/>
    <line x1="460" y1="220" x2="460" y2="250" stroke="#ef4444" stroke-width="2"/><rect x="454" y="225" width="12" height="20" fill="#ef4444"/>
    <line x1="500" y1="235" x2="500" y2="260" stroke="#ef4444" stroke-width="2"/><rect x="494" y="240" width="12" height="16" fill="#ef4444"/>
  </g>
  <text x="540" y="250" fill="#f472b6" font-size="11">target: next liquidity pool</text>

  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>
</svg>
