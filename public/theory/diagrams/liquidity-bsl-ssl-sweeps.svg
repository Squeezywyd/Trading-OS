<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace, monospace">
  <title>Buy-side liquidity above equal highs: a wick sweep that reverses, contrasted with a body-close run that continues</title>
  <rect x="1" y="1" width="798" height="448" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <text x="400" y="30" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="bold">Liquidity: Sweep vs. Run</text>

  <!-- divider -->
  <line x1="570" y1="55" x2="570" y2="400" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ===== LEFT: sweep panel ===== -->
  <text x="46" y="60" fill="#f472b6" font-size="13" font-weight="bold">Sweep (raid) — wick beyond, close back inside</text>

  <g stroke="#1e293b" stroke-opacity="0.4">
    <line x1="46" y1="130" x2="540" y2="130"/>
    <line x1="46" y1="210" x2="540" y2="210"/>
    <line x1="46" y1="290" x2="540" y2="290"/>
  </g>

  <!-- equal highs / BSL dashed line -->
  <line x1="180" y1="250" x2="460" y2="250" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="182" y="245" fill="#f472b6" font-size="12">BSL (equal highs)</text>

  <g stroke-width="1.5">
    <!-- 1 -->
    <line x1="80" y1="335" x2="80" y2="295" stroke="#22c55e"/>
    <rect x="68" y="300" width="24" height="30" fill="#22c55e"/>
    <!-- 2 -->
    <line x1="140" y1="322" x2="140" y2="295" stroke="#ef4444"/>
    <rect x="128" y="300" width="24" height="20" fill="#ef4444"/>
    <!-- 3: first equal high -->
    <line x1="200" y1="322" x2="200" y2="250" stroke="#22c55e"/>
    <rect x="188" y="255" width="24" height="65" fill="#22c55e"/>
    <!-- 4 -->
    <line x1="260" y1="277" x2="260" y2="250" stroke="#ef4444"/>
    <rect x="248" y="255" width="24" height="20" fill="#ef4444"/>
    <!-- 5: second equal high -->
    <line x1="320" y1="277" x2="320" y2="250" stroke="#22c55e"/>
    <rect x="308" y="255" width="24" height="20" fill="#22c55e"/>
    <!-- 6 -->
    <line x1="380" y1="282" x2="380" y2="250" stroke="#ef4444"/>
    <rect x="368" y="255" width="24" height="25" fill="#ef4444"/>
    <!-- 7: sweep candle, wick pokes above BSL line then closes back below -->
    <line x1="440" y1="278" x2="440" y2="225" stroke="#ef4444"/>
    <rect x="428" y="235" width="24" height="43" fill="#ef4444"/>
    <circle cx="440" cy="225" r="4" fill="#f472b6"/>
    <!-- 8: reversal continues -->
    <line x1="500" y1="332" x2="500" y2="278" stroke="#ef4444"/>
    <rect x="488" y="280" width="24" height="50" fill="#ef4444"/>
  </g>
  <text x="360" y="205" fill="#f472b6" font-size="12">Sweep -&gt; MSS -&gt; reversal</text>

  <!-- ===== RIGHT: run panel ===== -->
  <text x="590" y="60" fill="#e5e7eb" font-size="13" font-weight="bold">Run — body closes beyond, holds</text>

  <line x1="600" y1="260" x2="750" y2="260" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="600" y="255" fill="#e5e7eb" font-size="11">Level</text>

  <g stroke-width="1.5">
    <line x1="620" y1="335" x2="620" y2="298" stroke="#22c55e"/>
    <rect x="610" y="300" width="20" height="30" fill="#22c55e"/>
    <line x1="660" y1="303" x2="660" y2="262" stroke="#22c55e"/>
    <rect x="650" y="265" width="20" height="35" fill="#22c55e"/>
    <line x1="700" y1="268" x2="700" y2="220" stroke="#22c55e"/>
    <rect x="690" y="225" width="20" height="40" fill="#22c55e"/>
    <line x1="740" y1="228" x2="740" y2="190" stroke="#22c55e"/>
    <rect x="730" y="195" width="20" height="30" fill="#22c55e"/>
  </g>
  <text x="600" y="380" fill="#e5e7eb" font-size="11">No reversal — continuation</text>

  <!-- legend -->
  <rect x="46" y="420" width="14" height="14" fill="#f472b6"/>
  <text x="66" y="431" fill="#e5e7eb" font-size="12">Liquidity pool / sweep point</text>
</svg>
