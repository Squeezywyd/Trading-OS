<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, monospace">
  <title>Opening gap (NDOG) with consequent-encroachment midpoint, and a Judas swing sweep-then-reversal into an FVG entry</title>
  <rect x="1" y="1" width="798" height="448" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="32" fill="#e5e7eb" font-size="16" font-weight="bold">Opening Gap (NDOG) + Judas Swing</text>

  <g stroke="#1e293b" stroke-opacity="0.4">
    <line x1="24" y1="90" x2="776" y2="90"/>
    <line x1="24" y1="150" x2="776" y2="150"/>
    <line x1="24" y1="210" x2="776" y2="210"/>
    <line x1="24" y1="270" x2="776" y2="270"/>
    <line x1="24" y1="330" x2="776" y2="330"/>
  </g>

  <!-- prior close candle -->
  <line x1="90" y1="150" x2="90" y2="180" stroke="#ef4444" stroke-width="2"/>
  <rect x="84" y="155" width="12" height="20" fill="#ef4444"/>
  <text x="60" y="200" fill="#94a3b8" font-size="11">17:00 close</text>

  <!-- gap rectangle -->
  <rect x="110" y="90" width="70" height="60" fill="#a78bfa" opacity="0.2"/>
  <line x1="110" y1="120" x2="180" y2="120" stroke="#a78bfa" stroke-dasharray="3 3" stroke-width="1.5"/>
  <text x="112" y="84" fill="#a78bfa" font-size="11" font-weight="bold">NDOG</text>
  <text x="184" y="124" fill="#a78bfa" font-size="11">CE (50%)</text>

  <!-- new open candle -->
  <line x1="200" y1="70" x2="200" y2="100" stroke="#22c55e" stroke-width="2"/>
  <rect x="194" y="75" width="12" height="20" fill="#22c55e"/>
  <text x="180" y="60" fill="#94a3b8" font-size="11">18:00 open</text>

  <!-- Judas swing: fake move down then reversal -->
  <text x="260" y="230" fill="#f59e0b" font-size="12" font-weight="bold">Judas swing (fake move)</text>
  <g>
    <line x1="280" y1="190" x2="280" y2="220" stroke="#ef4444" stroke-width="2"/><rect x="274" y="195" width="12" height="20" fill="#ef4444"/>
    <line x1="320" y1="210" x2="320" y2="260" stroke="#ef4444" stroke-width="2"/><rect x="314" y="215" width="12" height="40" fill="#ef4444"/>
    <line x1="360" y1="240" x2="360" y2="290" stroke="#ef4444" stroke-width="2"/><rect x="354" y="245" width="12" height="40" fill="#ef4444"/>
  </g>
  <line x1="260" y1="290" x2="760" y2="290" stroke="#f472b6" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="600" y="305" fill="#f472b6" font-size="11">swept liquidity level</text>

  <!-- reversal + MSS -->
  <path d="M 366 280 L 420 200" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="370" y="190" fill="#22d3ee" font-size="12" font-weight="bold">MSS + displacement</text>

  <!-- FVG from reversal -->
  <rect x="440" y="150" width="70" height="50" fill="#a78bfa" opacity="0.22"/>
  <text x="442" y="145" fill="#a78bfa" font-size="11">FVG retrace / entry</text>

  <g>
    <line x1="480" y1="170" x2="480" y2="150" stroke="#22c55e" stroke-width="2"/><rect x="474" y="155" width="12" height="15" fill="#22c55e"/>
    <line x1="520" y1="150" x2="520" y2="120" stroke="#22c55e" stroke-width="2"/><rect x="514" y="125" width="12" height="25" fill="#22c55e"/>
    <line x1="560" y1="130" x2="560" y2="100" stroke="#22c55e" stroke-width="2"/><rect x="554" y="105" width="12" height="25" fill="#22c55e"/>
  </g>
  <text x="580" y="100" fill="#22c55e" font-size="11">true direction (distribution)</text>

  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <g font-size="11" fill="#e5e7eb">
    <rect x="600" y="400" width="12" height="12" fill="#a78bfa" opacity="0.4"/><text x="618" y="410">gap / FVG</text>
    <rect x="600" y="418" width="12" height="12" fill="#f472b6" opacity="0.6"/><text x="618" y="428">swept level</text>
  </g>
</svg>
