<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace, monospace">
  <title>Market structure: BOS continuing an uptrend, then an MSS with displacement reversing it</title>
  <rect x="1" y="1" width="798" height="448" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- grid -->
  <g stroke="#1e293b" stroke-opacity="0.4">
    <line x1="40" y1="100" x2="760" y2="100"/>
    <line x1="40" y1="180" x2="760" y2="180"/>
    <line x1="40" y1="260" x2="760" y2="260"/>
    <line x1="40" y1="340" x2="760" y2="340"/>
  </g>

  <text x="400" y="30" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="bold">Market Structure: BOS -&gt; MSS (with Displacement)</text>

  <!-- swing level dashed lines -->
  <line x1="300" y1="170" x2="490" y2="170" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="220" y="166" fill="#e5e7eb" font-size="12">Swing High 1</text>

  <line x1="350" y1="218" x2="550" y2="218" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="352" y="234" fill="#e5e7eb" font-size="12">Protected Low</text>

  <!-- FVG left by displacement -->
  <rect x="520" y="190" width="90" height="80" fill="#a78bfa" opacity="0.22"/>
  <text x="524" y="285" fill="#c4b5fd" font-size="12">FVG</text>

  <!-- candles: (x, bodyTop, bodyBottom, wickTop, wickBottom, color) -->
  <g stroke-width="1.5">
    <!-- 1 -->
    <line x1="70" y1="345" x2="70" y2="305" stroke="#22c55e"/>
    <rect x="58" y="310" width="24" height="30" fill="#22c55e"/>
    <!-- 2 -->
    <line x1="130" y1="315" x2="130" y2="265" stroke="#22c55e"/>
    <rect x="118" y="270" width="24" height="40" fill="#22c55e"/>
    <!-- 3 -->
    <line x1="190" y1="292" x2="190" y2="265" stroke="#ef4444"/>
    <rect x="178" y="270" width="24" height="20" fill="#ef4444"/>
    <!-- 4 -->
    <line x1="250" y1="292" x2="250" y2="225" stroke="#22c55e"/>
    <rect x="238" y="230" width="24" height="60" fill="#22c55e"/>
    <!-- 5 (swing high 1) -->
    <line x1="310" y1="233" x2="310" y2="170" stroke="#22c55e"/>
    <rect x="298" y="175" width="24" height="55" fill="#22c55e"/>
    <!-- 6 (protected low) -->
    <line x1="370" y1="218" x2="370" y2="172" stroke="#ef4444"/>
    <rect x="358" y="175" width="24" height="40" fill="#ef4444"/>
    <!-- 7 -->
    <line x1="430" y1="217" x2="430" y2="185" stroke="#22c55e"/>
    <rect x="418" y="190" width="24" height="25" fill="#22c55e"/>
    <!-- 8 (BOS) -->
    <line x1="490" y1="192" x2="490" y2="127" stroke="#22c55e"/>
    <rect x="478" y="130" width="24" height="60" fill="#22c55e"/>
    <!-- 9 (MSS + displacement) -->
    <line x1="550" y1="302" x2="550" y2="128" stroke="#ef4444"/>
    <rect x="538" y="130" width="24" height="170" fill="#ef4444"/>
    <rect x="534" y="126" width="32" height="178" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- 10 -->
    <line x1="610" y1="343" x2="610" y2="297" stroke="#ef4444"/>
    <rect x="598" y="300" width="24" height="40" fill="#ef4444"/>
    <!-- 11 (retrace into FVG) -->
    <line x1="670" y1="342" x2="670" y2="300" stroke="#22c55e"/>
    <rect x="658" y="310" width="24" height="30" fill="#22c55e"/>
    <!-- 12 -->
    <line x1="730" y1="352" x2="730" y2="305" stroke="#ef4444"/>
    <rect x="718" y="310" width="24" height="40" fill="#ef4444"/>
  </g>

  <!-- BOS marker -->
  <circle cx="490" cy="120" r="4" fill="#22d3ee"/>
  <text x="470" y="108" fill="#22d3ee" font-size="13" font-weight="bold">BOS</text>

  <!-- MSS marker -->
  <text x="558" y="100" fill="#22d3ee" font-size="13" font-weight="bold">MSS + Displacement</text>

  <!-- legend -->
  <rect x="60" y="410" width="14" height="14" fill="#22d3ee"/>
  <text x="80" y="421" fill="#e5e7eb" font-size="12">Structural break (BOS / MSS)</text>
  <rect x="330" y="410" width="14" height="14" fill="#a78bfa" opacity="0.6"/>
  <text x="350" y="421" fill="#e5e7eb" font-size="12">FVG left by displacement</text>
</svg>
