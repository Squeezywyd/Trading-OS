<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, monospace">
  <title>Double sweep: first liquidity raid fails to hold, a second deeper raid traps late fades, then the real reversal displaces</title>
  <rect x="1" y="1" width="798" height="448" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="32" fill="#e5e7eb" font-size="16" font-weight="bold">Double Sweep (Turtle Soup, two raids)</text>

  <g stroke="#1e293b" stroke-opacity="0.4">
    <line x1="24" y1="90" x2="776" y2="90"/>
    <line x1="24" y1="150" x2="776" y2="150"/>
    <line x1="24" y1="210" x2="776" y2="210"/>
    <line x1="24" y1="270" x2="776" y2="270"/>
    <line x1="24" y1="330" x2="776" y2="330"/>
  </g>

  <!-- original swing low -->
  <line x1="24" y1="240" x2="776" y2="240" stroke="#f472b6" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="30" y="234" fill="#f472b6" font-size="11">prior swing low (liquidity)</text>

  <!-- approach candles -->
  <g>
    <line x1="70" y1="150" x2="70" y2="190" stroke="#ef4444" stroke-width="2"/><rect x="64" y="155" width="12" height="25" fill="#ef4444"/>
    <line x1="110" y1="170" x2="110" y2="210" stroke="#ef4444" stroke-width="2"/><rect x="104" y="175" width="12" height="25" fill="#ef4444"/>
  </g>

  <!-- sweep 1: fails to hold -->
  <line x1="150" y1="200" x2="150" y2="255" stroke="#ef4444" stroke-width="2.5"/>
  <rect x="144" y="210" width="12" height="30" fill="#ef4444"/>
  <text x="120" y="270" fill="#f59e0b" font-size="11" font-weight="bold">sweep #1</text>
  <g>
    <line x1="190" y1="200" x2="190" y2="230" stroke="#22c55e" stroke-width="2"/><rect x="184" y="205" width="12" height="20" fill="#22c55e"/>
    <text x="185" y="195" fill="#94a3b8" font-size="10">premature bounce</text>
  </g>

  <!-- second push down: sweep 2, deeper -->
  <g>
    <line x1="230" y1="210" x2="230" y2="250" stroke="#ef4444" stroke-width="2"/><rect x="224" y="215" width="12" height="30" fill="#ef4444"/>
    <line x1="270" y1="230" x2="270" y2="290" stroke="#ef4444" stroke-width="2.5"/><rect x="264" y="245" width="12" height="35" fill="#ef4444"/>
  </g>
  <text x="290" y="300" fill="#f59e0b" font-size="11" font-weight="bold">sweep #2 (deeper — the real trap)</text>
  <line x1="230" y1="295" x2="776" y2="295" stroke="#f472b6" stroke-dasharray="3 3" stroke-width="1.5"/>

  <!-- reversal back through -->
  <path d="M 280 285 L 340 210" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arrow5)"/>
  <text x="290" y="200" fill="#22d3ee" font-size="12" font-weight="bold">reversal back into range</text>

  <!-- FVG entry zone -->
  <rect x="370" y="170" width="70" height="45" fill="#a78bfa" opacity="0.22"/>
  <text x="372" y="165" fill="#a78bfa" font-size="11">FVG / entry</text>

  <!-- displacement up -->
  <g>
    <line x1="480" y1="180" x2="480" y2="150" stroke="#22c55e" stroke-width="2"/><rect x="474" y="155" width="12" height="20" fill="#22c55e"/>
    <line x1="520" y1="150" x2="520" y2="120" stroke="#22c55e" stroke-width="2"/><rect x="514" y="125" width="12" height="20" fill="#22c55e"/>
    <line x1="560" y1="120" x2="560" y2="95" stroke="#22c55e" stroke-width="2"/><rect x="554" y="100" width="12" height="18" fill="#22c55e"/>
  </g>
  <text x="580" y="90" fill="#f472b6" font-size="11">target: next liquidity / range high</text>

  <defs>
    <marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>
</svg>
