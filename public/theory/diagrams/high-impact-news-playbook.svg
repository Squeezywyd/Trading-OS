<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace, monospace">
  <title>News release candle sequence: pre-news range, spike sweeping the range low, MSS displacement leaving an FVG, entry on the retrace</title>
  <rect x="10" y="10" width="780" height="430" rx="12" fill="#0b1220" stroke="#1e293b" />
  <text x="400" y="36" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="bold">News Release: Spike, Sweep, Displacement, Retrace</text>

  <!-- pre-news range -->
  <line x1="70" y1="240" x2="470" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" />
  <line x1="70" y1="290" x2="470" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" />
  <text x="75" y="233" fill="#94a3b8" font-size="10">pre-news range high</text>
  <text x="75" y="303" fill="#94a3b8" font-size="10">pre-news range low</text>

  <!-- target line -->
  <line x1="70" y1="90" x2="470" y2="90" stroke="#f472b6" stroke-width="1" stroke-dasharray="4,3" />
  <text x="330" y="83" fill="#f472b6" font-size="10">target: opposite range side</text>

  <!-- FVG zone -->
  <rect x="295" y="190" width="35" height="65" fill="#a78bfa" fill-opacity="0.25" stroke="#a78bfa" stroke-opacity="0.6" />
  <text x="312" y="184" text-anchor="middle" fill="#a78bfa" font-size="10">FVG</text>

  <!-- candles: pre-news chop -->
  <g stroke-width="1.5">
    <line x1="110" y1="248" x2="110" y2="280" stroke="#22c55e" />
    <rect x="100" y="255" width="20" height="20" fill="#22c55e" />

    <line x1="160" y1="255" x2="160" y2="285" stroke="#ef4444" />
    <rect x="150" y="260" width="20" height="20" fill="#ef4444" />

    <line x1="210" y1="245" x2="210" y2="275" stroke="#22c55e" />
    <rect x="200" y="250" width="20" height="20" fill="#22c55e" />

    <!-- spike candle: sweeps below range low -->
    <line x1="260" y1="250" x2="260" y2="335" stroke="#22c55e" />
    <rect x="250" y="255" width="20" height="10" fill="#22c55e" />

    <!-- displacement candle -->
    <line x1="310" y1="145" x2="310" y2="258" stroke="#22c55e" />
    <rect x="300" y="150" width="20" height="105" fill="#22c55e" />

    <!-- retrace into FVG -->
    <line x1="360" y1="190" x2="360" y2="220" stroke="#ef4444" />
    <rect x="350" y="195" width="20" height="20" fill="#ef4444" />

    <!-- continuation -->
    <line x1="410" y1="115" x2="410" y2="165" stroke="#22c55e" />
    <rect x="400" y="120" width="20" height="40" fill="#22c55e" />

    <line x1="460" y1="85" x2="460" y2="135" stroke="#22c55e" />
    <rect x="450" y="90" width="20" height="40" fill="#22c55e" />
  </g>

  <text x="260" y="350" text-anchor="middle" fill="#f472b6" font-size="10">spike sweeps range low</text>
  <text x="310" y="130" text-anchor="middle" fill="#22d3ee" font-size="10">MSS + displacement</text>

  <!-- entry marker -->
  <circle cx="360" cy="207" r="6" fill="none" stroke="#22d3ee" stroke-width="2" />
  <text x="360" y="270" text-anchor="middle" fill="#22d3ee" font-size="10">entry: FVG retrace</text>

  <text x="400" y="400" text-anchor="middle" fill="#64748b" font-size="10">Never enter on the print candle — wait for the sweep, then the displacement, then the retrace.</text>
</svg>
